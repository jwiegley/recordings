[package]
name = "recordings"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Watch, transcribe, clean, and archive voice recordings"
license = "BSD-3-Clause"
authors = ["John Wiegley <johnw@newartisans.com>"]

[dependencies]
anyhow = "1.0"
# Already linked as rustls's crypto provider; only its digests are used here.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
notify = "8.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"
